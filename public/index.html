<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanpin — item-by-item inventory</title>
  <link rel="stylesheet" href="/tw.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23c23a21'/><text x='50' y='70' text-anchor='middle' font-size='58' fill='white' font-family='serif'>単</text></svg>" />
</head>
<body class="page antialiased">
  <header class="site-header">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
      <a href="/" class="brand" title="Tanpin home">
        <span class="brand-seal" aria-hidden="true">単</span>
        <div>
          <h1>Tanpin <span>item-by-item inventory</span></h1>
          <p id="company-name">—</p>
        </div>
      </a>
      <div class="flex items-center gap-2 ml-auto text-xs header-actions">
        <span id="store-clock" class="store-clock" title="Store local time">—</span>
        <span id="daemon-pill" class="daemon-pill">daemon ●</span>
        <button id="btn-run" class="btn btn-primary">Run cycle now</button>
        <button id="btn-seed" class="btn btn-ghost btn-on-dark">Load demo data</button>
      </div>
    </div>
  </header>

  <section class="max-w-7xl mx-auto px-4 mt-4">
    <div id="kpis" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3"></div>
  </section>

  <nav class="max-w-7xl mx-auto px-4 mt-5 tab-bar text-sm">
    <button data-tab="dashboard" class="tab tab-active">Dashboard</button>
    <button data-tab="products" class="tab">Products</button>
    <button data-tab="orders" class="tab">Purchase Orders</button>
    <button data-tab="suppliers" class="tab">Suppliers</button>
    <button data-tab="forecast" class="tab">Forecast &amp; Hypotheses</button>
    <button data-tab="activity" class="tab">Activity</button>
    <button data-tab="api" class="tab">API &amp; Integrations</button>
    <button data-tab="settings" class="tab">Settings</button>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-5">
    <div id="tab-dashboard" class="tab-panel"></div>
    <div id="tab-products" class="tab-panel hidden"></div>
    <div id="tab-orders" class="tab-panel hidden"></div>
    <div id="tab-suppliers" class="tab-panel hidden"></div>
    <div id="tab-forecast" class="tab-panel hidden"></div>
    <div id="tab-activity" class="tab-panel hidden"></div>
    <div id="tab-api" class="tab-panel hidden"></div>
    <div id="tab-settings" class="tab-panel hidden"></div>
  </main>

  <div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <footer class="site-footer">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center text-xs">
      Tanpin · open-source item-by-item inventory · per-SKU forecast, automatic reorder, supplier email, delivery ETAs ·
      built on the tanpin kanri (単品管理) method popularized by Japanese convenience retail
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
